# MeterBar — Windows CI build.
#
# Mirrors build-release.bat step-for-step so a CI installer and a local
# installer are the same product:
#   checkout -> version from CMakeLists.txt (the single source) ->
#   configure + build Release -> run the DSP suite -> stage
#   dist\MeterBar.exe -> ISCC with /DMyAppVersion -> MeterBar-Setup.exe.
#
# Triggers:
#   - a version tag (vX.Y.Z): ALSO publishes the installer as a GitHub
#     Release asset — that release is the in-app updater's feed. The
#     job FAILS if the tag does not match the CMakeLists version:
#     auto-commit is not auto-release (docs/V019_PLAN.md section 2.3).
#   - branch pushes / manual runs: the installer is uploaded as a
#     workflow artifact only (proof CI is green; nothing is released).
name: build-windows

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # needed only by the tag-release step

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from CMakeLists.txt (single source of truth)
        id: ver
        shell: pwsh
        run: |
          $line = Select-String -Path CMakeLists.txt -Pattern 'project\(MeterBar VERSION ([0-9]+\.[0-9]+\.[0-9]+)' | Select-Object -First 1
          if (-not $line) { throw "project VERSION not found in CMakeLists.txt" }
          $v = $line.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "MeterBar version: $v"
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$v") {
            throw "Tag ${{ github.ref_name }} does not match CMakeLists version v$v — refusing to release."
          }

      - name: Configure (JUCE is fetched by CMake — no git needed for it)
        run: cmake -S . -B build-app -DMETERBAR_BUILD_APP=ON -A x64

      - name: Build Release
        run: cmake --build build-app --config Release

      - name: DSP suite
        run: |
          cmake -S . -B build-dsp -A x64
          cmake --build build-dsp --config Release
          ./build-dsp/Release/test_dsp.exe

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Decode self-signing certificate (skips cleanly when the secret is not set)
        id: cert
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.SELF_SIGN_PFX_BASE64 }}
        run: |
          if (-not $env:PFX_B64) {
            Write-Host "::warning::SELF_SIGN_PFX_BASE64 secret is not set - this build will be UNSIGNED."
            "have_cert=false" >> $env:GITHUB_OUTPUT
          } else {
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\selfsign.pfx", [Convert]::FromBase64String($env:PFX_B64))
            "have_cert=true" >> $env:GITHUB_OUTPUT
          }

      - name: Stage dist and compile the installer (mirrors build-release.bat)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item "build-app/app/MeterBar_artefacts/Release/MeterBar.exe" "dist/MeterBar.exe"
          # v0.23.0: stage the Live Captions helper (mirrors build-release.bat)
          New-Item -ItemType Directory -Force dist/Captions | Out-Null
          Copy-Item "tools/captions/meterbar_captions_helper.py" "dist/Captions/"
          Copy-Item "tools/captions/requirements.txt" "dist/Captions/"
          Copy-Item "tools/captions/download_models.py" "dist/Captions/"
          Copy-Item "tools/captions/setup_captions_runtime.bat" "dist/Captions/"
          if ("${{ steps.cert.outputs.have_cert }}" -eq "true") {
            $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
            & $signtool sign /f "$env:RUNNER_TEMP\selfsign.pfx" /p "${{ secrets.SELF_SIGN_PFX_PASSWORD }}" /fd sha256 /tr "http://timestamp.digicert.com" /td sha256 "dist/MeterBar.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on the app exe" }
          }
          ISCC "/DMyAppVersion=${{ steps.ver.outputs.version }}" MeterBar.iss
          if ("${{ steps.cert.outputs.have_cert }}" -eq "true") {
            & $signtool sign /f "$env:RUNNER_TEMP\selfsign.pfx" /p "${{ secrets.SELF_SIGN_PFX_PASSWORD }}" /fd sha256 /tr "http://timestamp.digicert.com" /td sha256 "dist/MeterBar-Setup.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed on the installer" }
          }

      - name: Upload installer as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MeterBar-Setup-${{ steps.ver.outputs.version }}
          path: dist/MeterBar-Setup.exe

      - name: Publish the installer on the version tag's GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MeterBar-Setup.exe

      - name: Remove self-signing certificate from the runner
        if: always()
        shell: pwsh
        run: Remove-Item "$env:RUNNER_TEMP\selfsign.pfx" -Force -ErrorAction SilentlyContinue
